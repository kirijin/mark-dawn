name: Build and Publish mark-dawn

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - '*.py'
      - '*.sh'
      - 'install.ps1'
      - 'mark-dawn.ps1'
      - '.github/workflows/build.yml'
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild without cache'
        required: false
        default: 'false'
        type: boolean

env:
  IMAGE_NAME: mark-dawn
  DOCKERHUB_REPO: docker.io/kirijin/mark-dawn
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate scripts, tests and configuration
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify all required files exist
        run: |
          echo "Verifying required files..."
          files=(
            "Dockerfile"
            "convert_pdf.py"
            "watcher.py"
            "docx_styler.py"
            "entrypoint.sh"
            "install.sh"
            "install-macos.sh"
            "install-macos-brew.sh"
            "install-macos-container.sh"
            "mark-dawn.sh"
            "libexec/mark-dawn-container"
            "libexec/mark-dawn-macos"
            "install.ps1"
            "mark-dawn.ps1"
            "requirements.txt"
            "README.md"
          )
          missing=()
          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              missing+=("$file")
              echo "❌ Missing: $file"
            else
              echo "✓ Found: $file"
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo ""
            echo "ERROR: Missing files: ${missing[*]}"
            exit 1
          fi
          echo ""
          echo "✓ All required files present"

      - name: Validate PowerShell syntax (both installers)
        shell: pwsh
        run: |
          foreach ($f in @("install.ps1", "mark-dawn.ps1")) {
            Write-Host "Validating PowerShell syntax for $f..."
            $content = Get-Content -Path $f -Raw
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseInput($content, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              Write-Host "❌ PowerShell syntax error(s) in ${f}:"
              $errors | ForEach-Object { Write-Host "  $($_.Message) @ line $($_.Extent.StartLineNumber)" }
              exit 1
            }
            Write-Host "✓ $f syntax valid"
          }

      - name: Validate Python syntax
        run: |
          echo "Validating Python syntax..."
          python3 -m py_compile convert_pdf.py
          python3 -m py_compile watcher.py
          python3 -m py_compile docx_styler.py
          echo "✓ Python syntax valid"

      - name: Validate shell script syntax
        run: |
          echo "Validating shell script syntax..."
          for f in install.sh install-macos.sh install-macos-brew.sh install-macos-container.sh mark-dawn.sh entrypoint.sh libexec/mark-dawn-container libexec/mark-dawn-macos; do
            bash -n "$f" || { echo "❌ bash -n failed: $f"; exit 1; }
          done
          echo "✓ Shell script syntax valid"

      - name: Shellcheck launchers and installers
        run: |
          echo "Running shellcheck (warning level)..."
          shellcheck -S warning \
            install.sh install-macos.sh install-macos-brew.sh install-macos-container.sh \
            mark-dawn.sh entrypoint.sh libexec/mark-dawn-container libexec/mark-dawn-macos
          echo "✓ Shellcheck clean"

      - name: Run Python test suite
        run: |
          echo "Installing test deps (python-docx is the only real dependency tests need)..."
          pip install pytest python-docx
          echo "Running pytest..."
          python3 -m pytest tests/ -q
          echo "✓ Test suite passed"

  build-and-push:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          no-cache: ${{ github.event.inputs.force_rebuild == 'true' }}

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: kirijin/mark-dawn
          readme-filepath: ./README.md

      - name: Image digest
        run: echo "Image pushed with digest ${{ steps.build.outputs.digest }}"

      - name: Build status
        if: success()
        run: |
          echo "✓ Docker image built and pushed successfully"
          echo "  Repository: ${{ env.DOCKERHUB_REPO }}"
          echo "  Tags: ${{ steps.meta.outputs.tags }}"

  smoke:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Container conversion smoke test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: mark-dawn:smoke
          cache-from: type=gha
          platforms: linux/amd64

      - name: Smoke test — container convert lands output on the host
        run: |
          set -euo pipefail
          SMOKE=$(mktemp -d)
          mkdir -p "$SMOKE/Inbox" "$SMOKE/Research" "$SMOKE/Inbox_Failed"
          echo "Generating fixture PDF inside the image..."
          # insert_textbox wraps the text so the page holds >100 chars →
          # the digital path (pymupdf4llm) runs and the .md is non-empty.
          docker run --rm -v "$SMOKE:/smoke" mark-dawn:smoke python -c \
            "import fitz; d=fitz.open(); p=d.new_page(); p.insert_textbox(fitz.Rect(72,72,523,700), 'Hello mark-dawn smoke test ' * 40); d.save('/smoke/Inbox/fixture.pdf')"
          echo "Converting (env vars as the launcher passes them)..."
          docker run --rm -v "$SMOKE:/data" \
            -e MARK_DAWN_INBOX_DIR=/data/Inbox \
            -e MARK_DAWN_OUT_DIR=/data/Research \
            -e MARK_DAWN_FAILED_DIR=/data/Inbox_Failed \
            mark-dawn:smoke convert /data/Inbox/fixture.pdf
          if [ -s "$SMOKE/Research/fixture.md" ]; then
            echo "SMOKE PASS: output landed on the host at $SMOKE/Research/fixture.md"
            head -c 200 "$SMOKE/Research/fixture.md"
            echo ""
          else
            echo "SMOKE FAIL: conversion ran but no output appeared on the host mount"
            exit 1
          fi
